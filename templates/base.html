<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>{% block title %}Bicalho Parts | Peças para Elevadores Multimarcas{% endblock %}</title>

    <meta name="description" content="Peças e componentes para elevadores multimarcas. Trabalhamos com peças para Atlas Schindler, Otis, TK Elevator, Hyundai, LG, Infolev e outras marcas. Enviamos para todo o Brasil.">

    <meta name="keywords" content="peças para elevadores, elevadores, peças elevador, manutenção de elevadores, componentes para elevadores, peças atlas schindler, peças otis, peças thyssenkrupp, tk elevator, peças hyundai, peças lg, peças infolev, botoeiras, inversores, placas para elevadores, cabos para elevadores, elevadores multimarcas">

    <meta name="author" content="Bicalho Parts">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0B4DBB">

    <link rel="canonical" href="https://bicalhoparts.com.br/">

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon.png') }}?v=2">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.png') }}?v=2">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.png') }}?v=2">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Bicalho Parts">
    <meta property="og:title" content="Bicalho Parts | Peças para Elevadores">
    <meta property="og:description" content="Peças e componentes para elevadores multimarcas. Qualidade, confiança e envio para todo o Brasil.">
    <meta property="og:url" content="https://bicalhoparts.com.br/">
    <meta property="og:image" content="{{ url_for('static', filename='img/logo.png', _external=True) }}">
    <meta property="og:locale" content="pt_BR">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Bicalho Parts | Peças para Elevadores">
    <meta name="twitter:description" content="Peças e componentes para elevadores multimarcas.">
    <meta name="twitter:image" content="{{ url_for('static', filename='img/logo.png', _external=True) }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">

    {% block head %}{% endblock %}
</head>
<body>

    {% block body %}{% endblock %}

    <script src="{{ url_for('static', filename='js/site.js') }}"></script>

    {% block scripts %}{% endblock %}

</body>
</html>
